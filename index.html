<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      background: #09090b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #29292d;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.ativo {
      background: #29292d;
      color: white;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .input-wrap input {
      width: 100%;
      padding: 15px 42px 15px 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
      font-size: 15px;
    }

    .clear-input {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:disabled {
      opacity: .5;
    }

    #resultado {
      margin-top: 20px;
    }

    .box {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .label {
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    a {
      color: #ddd;
      word-break: break-all;
    }

    .erro {
      color: #ff9999;
      background: #301416;
      border: 1px solid #702020;
      padding: 15px;
      border-radius: 12px;
    }

    .aviso {
      color: #ffd875;
      background: #30270f;
      border: 1px solid #705b1c;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .sucesso {
      color: #86efac;
      background: #14291c;
      border: 1px solid #1f5c37;
      padding: 15px;
      border-radius: 12px;
    }

    .short-link {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .short-link input {
      font-family: monospace;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
    }

    .copy-btn,
    .open-btn,
    .cancel-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-btn {
      background: #4ade80;
      color: #062b14;
    }

    .open-btn {
      background: #29292d;
      color: white;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
    }

    .loot-button {
      width: 100%;
      margin-top: 12px;
    }

    .loot-data {
      width: 100%;
      min-height: 90px;
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      background: #09090b;
      color: white;
      border: 1px solid #444;
      font-family: monospace;
      resize: vertical;
    }

    .hist-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hist-titulo {
      color: #999;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .limpar-btn {
      border: 1px solid #702020;
      background: transparent;
      color: #ff9999;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .hist-item {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      position: relative;
    }

    .hist-original {
      color: #ddd;
      font-size: 13px;
      word-break: break-all;
      padding-right: 30px;
      margin-bottom: 6px;
    }

    .hist-curto {
      color: #4ade80;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .hist-data {
      color: #666;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .hist-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fechar-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
    }

    .hist-vazio {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
    }

    .confirmacao {
      background: #1c1c20;
      border: 1px solid #702020;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .confirmacao strong {
      color: #ff9999;
    }

    .confirmacao-acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .apagar-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #dc2626;
      color: white;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      form {
        flex-direction: column;
      }

      button[type="submit"] {
        height: 50px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="tag">LINK ANALYZER</div>

  <h1 id="titulo">Analisador de links</h1>

  <p id="subtitulo">
    Descubra o destino final de um link e visualize seus redirecionamentos.
  </p>

  <div class="tabs">
    <button class="tab ativo" data-modo="analisar">Analisar</button>
    <button class="tab" data-modo="encurtar">Encurtar</button>
    <button class="tab" data-modo="historico">Histórico</button>
  </div>

  <form id="form">

    <div class="input-wrap">

      <input
        id="url"
        type="url"
        placeholder="https://exemplo.com/link"
        required
      >

      <button
        type="button"
        class="clear-input"
        id="clearInput"
      >
        ✕
      </button>

    </div>

    <button id="botao" type="submit">
      Analisar
    </button>

  </form>

  <div id="resultado"></div>

</div>

<script>

const form = document.getElementById("form");
const urlInput = document.getElementById("url");
const resultado = document.getElementById("resultado");
const botao = document.getElementById("botao");
const titulo = document.getElementById("titulo");
const subtitulo = document.getElementById("subtitulo");
const tabs = document.querySelectorAll(".tab");
const clearInput = document.getElementById("clearInput");

const HIST_KEY = "linkAnalyzerHistorico";

let modo = "analisar";


/* =========================
   LIMPAR INPUT
========================= */

function atualizarXInput() {
  clearInput.style.display =
    urlInput.value.length > 0 ? "block" : "none";
}

urlInput.addEventListener("input", atualizarXInput);

clearInput.addEventListener("click", function() {
  urlInput.value = "";
  atualizarXInput();
  urlInput.focus();
});

atualizarXInput();


/* =========================
   ABAS
========================= */

tabs.forEach(function(tab) {

  tab.addEventListener("click", function() {

    modo = tab.dataset.modo;

    tabs.forEach(function(t) {
      t.classList.remove("ativo");
    });

    tab.classList.add("ativo");

    resultado.innerHTML = "";

    if (modo === "analisar") {

      form.style.display = "flex";

      titulo.textContent = "Analisador de links";

      subtitulo.textContent =
        "Descubra o destino final de um link e visualize seus redirecionamentos.";

      botao.textContent = "Analisar";

      urlInput.placeholder =
        "https://exemplo.com/link";

    }

    else if (modo === "encurtar") {

      form.style.display = "flex";

      titulo.textContent = "Encurtador de links";

      subtitulo.textContent =
        "Cole uma URL e receba um link curto que redireciona para o destino final.";

      botao.textContent = "Encurtar";

      urlInput.placeholder =
        "https://exemplo.com/link-muito-longo";

    }

    else {

      form.style.display = "none";

      titulo.textContent = "Histórico";

      subtitulo.textContent =
        "Todos os links que você já encurtou neste navegador.";

      renderizarHistorico();

    }

  });

});


/* =========================
   FORMULÁRIO
========================= */

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const url = urlInput.value.trim();

  if (!url) {
    return;
  }

  resultado.innerHTML = "";

  botao.disabled = true;

  botao.textContent =
    modo === "analisar"
      ? "Analisando..."
      : "Encurtando...";

  try {

    const endpoint =
      modo === "analisar"
        ? "/api/analisar"
        : "/api/encurtar";

    const resposta = await fetch(endpoint, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        url: url
      })

    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(
        dados.error || "Erro na requisição."
      );
    }

    if (modo === "analisar") {

      renderizarAnalise(dados);

    }

    else {

      salvarNoHistorico(dados);

      renderizarEncurtado(dados);

    }

  }

  catch (erro) {

    resultado.innerHTML = `
      <div class="erro">
        ${escapeHtml(erro.message)}
      </div>
    `;

  }

  finally {

    botao.disabled = false;

    botao.textContent =
      modo === "analisar"
        ? "Analisar"
        : "Encurtar";

  }

});


/* =========================
   ANÁLISE
========================= */

function renderizarAnalise(dados) {

  let html = `

    <div class="box">

      <div class="label">
        DESTINO FINAL
      </div>

      <a
        href="${escapeAttribute(dados.finalUrl)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHtml(dados.finalUrl)}
      </a>

    </div>

    <div class="box">

      <div class="label">
        DOMÍNIO FINAL
      </div>

      ${escapeHtml(dados.finalHost || "")}

    </div>

    <div class="box">

      <div class="label">
        REDIRECIONAMENTOS
      </div>

      ${(dados.redirects || []).length}

    </div>

  `;


  if (
    dados.warnings &&
    dados.warnings.length
  ) {

    html += `

      <div class="aviso">

        <strong>Atenção</strong>

        <ul>

          ${dados.warnings
            .map(function(w) {
              return `<li>${escapeHtml(w)}</li>`;
            })
            .join("")}

        </ul>

      </div>

    `;

  }


  html += `

    <div class="box">

      <div class="label">
        CADEIA DE REDIRECIONAMENTOS
      </div>

  `;


  (dados.redirects || []).forEach(
    function(item, index) {

      html += `

        <p>

          ${index + 1}.
          <strong>
            ${escapeHtml(item.status)}
          </strong>

          <br>

          <a
            href="${escapeAttribute(item.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(item.url)}
          </a>

        </p>

      `;

    }
  );


  html += `</div>`;

  resultado.innerHTML = html;

}


/* =========================
   ENCURTADO
========================= */

function renderizarEncurtado(dados) {

  const avisoReuso =
    dados.reutilizado

      ? `
        <div
          class="aviso"
          style="margin-bottom:12px;"
        >
          ♻️ Esse link já tinha sido encurtado antes.
          Reutilizei o mesmo código.
        </div>
      `

      : "";


  resultado.innerHTML = `

    ${avisoReuso}

    <div class="sucesso">

      <strong>
        ✅ Link curto criado!
      </strong>

    </div>


    <div class="box">

      <div class="label">
        LINK CURTO
      </div>

      <div class="short-link">

        <input
          type="text"
          value="${escapeAttribute(dados.shortUrl)}"
          readonly
          id="linkCurto"
        >

        <button
          class="copy-btn"
          type="button"
          onclick="copiarLink('linkCurto', this)"
        >
          Copiar
        </button>

        <button
          class="open-btn"
          type="button"
          onclick="abrirLink(${JSON.stringify(dados.shortUrl)})"
        >
          Abrir
        </button>

      </div>

    </div>


    <div class="box">

      <div class="label">
        DESTINO FINAL
      </div>

      <a
        href="${escapeAttribute(dados.finalUrl)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHtml(dados.finalUrl)}
      </a>

    </div>


    <div class="box">

      <div class="label">
        API OFICIAL DO LOOTLABS
      </div>

      <p>
        Gere um valor <code>data</code> através da API
        oficial para um destino autorizado.
      </p>

      <button
        type="button"
        class="open-btn loot-button"
        onclick="gerarLootLabsAPI(${JSON.stringify(dados.finalUrl)})"
      >
        Gerar pela API do LootLabs
      </button>

      <div id="lootResultado"></div>

    </div>

  `;

}


/* =========================
   LOOTLABS — API OFICIAL
========================= */

async function gerarLootLabsAPI(destino) {

  const area =
    document.getElementById("lootResultado");

  if (!area) {
    return;
  }


  area.innerHTML = `

    <div class="aviso">
      Gerando...
    </div>

  `;


  try {

    const resposta = await fetch(
      "/api/lootlabs",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          destinationUrl: destino
        })

      }
    );


    const dados = await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        dados.error ||
        "A API recusou a solicitação."
      );

    }


    area.innerHTML = `

      <div
        class="sucesso"
        style="margin-top:12px;"
      >

        <strong>
          ✅ Data gerado pela API
        </strong>

      </div>


      <textarea
        class="loot-data"
        readonly
      >${escapeHtml(dados.data || "")}</textarea>


      <button
        type="button"
        class="copy-btn"
        style="margin-top:8px;"
        onclick="copiarTexto(
          ${JSON.stringify(dados.data || "")},
          this
        )"
      >
        Copiar data
      </button>

    `;

  }

  catch (erro) {

    area.innerHTML = `

      <div
        class="erro"
        style="margin-top:12px;"
      >
        ${escapeHtml(erro.message)}
      </div>

    `;

  }

}


/* =========================
   HISTÓRICO
========================= */

function lerHistorico() {

  try {

    const raw =
      localStorage.getItem(HIST_KEY);

    return raw
      ? JSON.parse(raw)
      : [];

  }

  catch {

    return [];

  }

}


function gravarHistorico(lista) {

  localStorage.setItem(
    HIST_KEY,
    JSON.stringify(lista)
  );

}


function salvarNoHistorico(dados) {

  const lista =
    lerHistorico();

  const jaExiste =
    lista.some(function(item) {
      return item.shortUrl === dados.shortUrl;
    });


  if (jaExiste) {
    return;
  }


  lista.unshift({

    shortUrl: dados.shortUrl,

    finalUrl: dados.finalUrl,

    originalUrl: dados.originalUrl,

    criadoEm: new Date().toISOString()

  });


  gravarHistorico(lista);

}


function renderizarHistorico() {

  const lista =
    lerHistorico();


  if (!lista.length) {

    resultado.innerHTML = `

      <div class="hist-vazio">

        Nenhum link salvo ainda.<br>

        Encurte um link pra ele aparecer aqui. 🔗

      </div>

    `;

    return;

  }


  let html = `

    <div class="hist-topo">

      <div class="hist-titulo">

        ${lista.length}
        link${lista.length > 1 ? "s" : ""}
        salvo${lista.length > 1 ? "s" : ""}

      </div>

      <button
        class="limpar-btn"
        onclick="pedirConfirmacaoLimparTudo()"
      >
        Limpar tudo
      </button>

    </div>

  `;


  lista.forEach(
    function(item, index) {

      html += `

        <div class="hist-item">

          <button
            class="fechar-btn"
            onclick="removerItem(${index})"
          >
            ✕
          </button>


          <div class="hist-original">

            ${escapeHtml(item.originalUrl)}

          </div>


          <div class="hist-curto">

            ${escapeHtml(item.shortUrl)}

          </div>


          <div class="hist-data">

            Encurtado em
            ${formatarData(item.criadoEm)}

          </div>


          <div class="hist-acoes">

            <button
              class="copy-btn"
              onclick="copiarTexto(
                ${JSON.stringify(item.shortUrl)},
                this
              )"
            >
              Copiar
            </button>


            <button
              class="open-btn"
              onclick="abrirLink(
                ${JSON.stringify(item.shortUrl)}
              )"
            >
              Abrir
            </button>

          </div>

        </div>

      `;

    }
  );


  resultado.innerHTML = html;

}


function removerItem(index) {

  const lista =
    lerHistorico();

  lista.splice(index, 1);

  gravarHistorico(lista);

  renderizarHistorico();

}


function pedirConfirmacaoLimparTudo() {

  resultado.innerHTML = `

    <div class="confirmacao">

      <strong>
        ⚠️ Apagar TODOS os links?
      </strong>

      <p>
        Essa ação não pode ser desfeita.
      </p>

      <div class="confirmacao-acoes">

        <button
          class="apagar-btn"
          onclick="confirmarLimparTudo()"
        >
          Sim, apagar tudo
        </button>

        <button
          class="cancel-btn"
          onclick="renderizarHistorico()"
        >
          Cancelar
        </button>

      </div>

    </div>

  `;

}


function confirmarLimparTudo() {

  localStorage.removeItem(HIST_KEY);

  renderizarHistorico();

}


/* =========================
   LINKS
========================= */

function abrirLink(url) {

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


function copiarLink(id, btn) {

  const input =
    document.getElementById(id);

  copiarTexto(
    input.value,
    btn
  );

}


function copiarTexto(texto, btn) {

  if (navigator.clipboard) {

    navigator.clipboard.writeText(texto)
      .then(function() {

        const original =
          btn.textContent;

        btn.textContent =
          "Copiado!";

        setTimeout(
          function() {
            btn.textContent = original;
          },
          1500
        );

      });

    return;

  }


  const tmp =
    document.createElement("textarea");

  tmp.value = texto;

  document.body.appendChild(tmp);

  tmp.select();

  document.execCommand("copy");

  document.body.removeChild(tmp);


  const original =
    btn.textContent;

  btn.textContent =
    "Copiado!";

  setTimeout(
    function() {
      btn.textContent = original;
    },
    1500
  );

}


/* =========================
   DATA
========================= */

function formatarData(iso) {

  const d =
    new Date(iso);

  const dia =
    String(d.getDate())
      .padStart(2, "0");

  const mes =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const ano =
    d.getFullYear();

  const hora =
    String(d.getHours())
      .padStart(2, "0");

  const min =
    String(d.getMinutes())
      .padStart(2, "0");

  return `${dia}/${mes}/${ano} às ${hora}:${min}`;

}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHtml(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(valor) {

  return escapeHtml(valor);

}

</script>

</body>
</html>
