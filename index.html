<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisador de Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:disabled {
      opacity: .5;
    }

    #resultado {
      margin-top: 20px;
    }

    .box {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .label {
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    a {
      color: #ddd;
      word-break: break-all;
    }

    .erro {
      color: #ff9999;
      background: #301416;
      border: 1px solid #702020;
      padding: 15px;
      border-radius: 12px;
    }

    .aviso {
      color: #ffd875;
      background: #30270f;
      border: 1px solid #705b1c;
      padding: 15px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      form {
        flex-direction: column;
      }

      button {
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tag">LINK ANALYZER</div>

    <h1>Analisador de links</h1>

    <p>
      Descubra o destino final de um link e visualize seus redirecionamentos.
    </p>

    <form id="form">
      <input
        id="url"
        type="url"
        placeholder="https://exemplo.com/link"
        required
      >

      <button id="botao" type="submit">
        Analisar
      </button>
    </form>

    <div id="resultado"></div>

  </div>

  <script>
    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("botao");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const url = urlInput.value.trim();

      resultado.innerHTML = "";
      botao.disabled = true;
      botao.textContent = "Analisando...";

      try {

        const resposta = await fetch("/api/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: url
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.error || "Não foi possível analisar o link.");
        }

        let html = `
          <div class="box">
            <div class="label">DESTINO FINAL</div>
            <a href="${dados.finalUrl}" target="_blank">
              ${dados.finalUrl}
            </a>
          </div>

          <div class="box">
            <div class="label">DOMÍNIO FINAL</div>
            ${dados.finalHost}
          </div>

          <div class="box">
            <div class="label">REDIRECIONAMENTOS</div>
            ${dados.redirects.length}
          </div>
        `;

        if (dados.warnings && dados.warnings.length) {
          html += `
            <div class="aviso">
              <strong>Atenção</strong>
              <ul>
                ${dados.warnings.map(w => `<li>${w}</li>`).join("")}
              </ul>
            </div>
          `;
        }

        html += `
          <div class="box">
            <div class="label">CADEIA DE REDIRECIONAMENTOS</div>
        `;

        dados.redirects.forEach((item, index) => {
          html += `
            <p>
              ${index + 1}. 
              <strong>${item.status}</strong><br>
              <a href="${item.url}" target="_blank">
                ${item.url}
              </a>
            </p>
          `;
        });

        html += `</div>`;

        resultado.innerHTML = html;

      } catch (erro) {

        resultado.innerHTML = `
          <div class="erro">
            ${erro.message}
          </div>
        `;

      } finally {

        botao.disabled = false;
        botao.textContent = "Analisar";

      }

    });
  </script>

</body>
</html>
