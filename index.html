<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Analyzer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      background: #09090b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #29292d;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.ativo {
      background: #29292d;
      color: white;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
      font-size: 15px;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:disabled { opacity: .5; }

    #resultado { margin-top: 20px; }

    .box {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .label {
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    a {
      color: #ddd;
      word-break: break-all;
    }

    .erro {
      color: #ff9999;
      background: #301416;
      border: 1px solid #702020;
      padding: 15px;
      border-radius: 12px;
    }

    .aviso {
      color: #ffd875;
      background: #30270f;
      border: 1px solid #705b1c;
      padding: 15px;
      border-radius: 12px;
    }

    .sucesso {
      color: #86efac;
      background: #14291c;
      border: 1px solid #1f5c37;
      padding: 15px;
      border-radius: 12px;
    }

    .short-link {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }

    .short-link input {
      font-family: monospace;
      font-size: 14px;
    }

    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #4ade80;
      color: #062b14;
    }

    @media (max-width: 600px) {
      h1 { font-size: 34px; }
      form { flex-direction: column; }
      button[type="submit"] { height: 50px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tag">LINK ANALYZER</div>

    <h1 id="titulo">Analisador de links</h1>

    <p id="subtitulo">
      Descubra o destino final de um link e visualize seus redirecionamentos.
    </p>

    <div class="tabs">
      <button class="tab ativo" data-modo="analisar">Analisar</button>
      <button class="tab" data-modo="encurtar">Encurtar</button>
    </div>

    <form id="form">
      <input
        id="url"
        type="url"
        placeholder="https://exemplo.com/link"
        required
      >

      <button id="botao" type="submit">
        Analisar
      </button>
    </form>

    <div id="resultado"></div>

  </div>

  <script>
    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("botao");
    const titulo = document.getElementById("titulo");
    const subtitulo = document.getElementById("subtitulo");
    const tabs = document.querySelectorAll(".tab");

    let modo = "analisar";

    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        modo = tab.dataset.modo;

        tabs.forEach(t => t.classList.remove("ativo"));
        tab.classList.add("ativo");

        resultado.innerHTML = "";

        if (modo === "analisar") {
          titulo.textContent = "Analisador de links";
          subtitulo.textContent = "Descubra o destino final de um link e visualize seus redirecionamentos.";
          botao.textContent = "Analisar";
          urlInput.placeholder = "https://exemplo.com/link";
        } else {
          titulo.textContent = "Encurtador de links";
          subtitulo.textContent = "Cole uma URL e receba um link curto que redireciona para o destino final.";
          botao.textContent = "Encurtar";
          urlInput.placeholder = "https://exemplo.com/link-muito-longo";
        }
      });
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const url = urlInput.value.trim();

      resultado.innerHTML = "";
      botao.disabled = true;
      botao.textContent = modo === "analisar" ? "Analisando..." : "Encurtando...";

      try {
        const endpoint = modo === "analisar" ? "/api/analisar" : "/api/encurtar";

        const resposta = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.error || "Erro na requisição.");
        }

        if (modo === "analisar") {
          renderizarAnalise(dados);
        } else {
          renderizarEncurtado(dados);
        }

      } catch (erro) {
        resultado.innerHTML = `
          <div class="erro">${erro.message}</div>
        `;
      } finally {
        botao.disabled = false;
        botao.textContent = modo === "analisar" ? "Analisar" : "Encurtar";
      }
    });

    function renderizarAnalise(dados) {
      let html = `
        <div class="box">
          <div class="label">DESTINO FINAL</div>
          <a href="${dados.finalUrl}" target="_blank">${dados.finalUrl}</a>
        </div>

        <div class="box">
          <div class="label">DOMÍNIO FINAL</div>
          ${dados.finalHost}
        </div>

        <div class="box">
          <div class="label">REDIRECIONAMENTOS</div>
          ${dados.redirects.length}
        </div>
      `;

      if (dados.warnings && dados.warnings.length) {
        html += `
          <div class="aviso">
            <strong>Atenção</strong>
            <ul>
              ${dados.warnings.map(w => `<li>${w}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      html += `
        <div class="box">
          <div class="label">CADEIA DE REDIRECIONAMENTOS</div>
      `;

      dados.redirects.forEach((item, index) => {
        html += `
          <p>
            ${index + 1}.
            <strong>${item.status}</strong><br>
            <a href="${item.url}" target="_blank">${item.url}</a>
          </p>
        `;
      });

      html += `</div>`;

      resultado.innerHTML = html;
    }

    function renderizarEncurtado(dados) {
      const html = `
        <div class="sucesso">
          <strong>✅ Link curto criado!</strong>
        </div>

        <div class="box">
          <div class="label">LINK CURTO</div>
          <div class="short-link">
            <input type="text" value="${dados.shortUrl}" readonly id="linkCurto">
            <button class="copy-btn" type="button" onclick="copiarLink()">Copiar</button>
          </div>
        </div>

        <div class="box">
          <div class="label">DESTINO FINAL</div>
          <a href="${dados.finalUrl}" target="_blank">${dados.finalUrl}</a>
        </div>
      `;

      resultado.innerHTML = html;
    }

    function copiarLink() {
      const input = document.getElementById("linkCurto");
      input.select();
      input.setSelectionRange(0, 99999);

      if (navigator.clipboard) {
        navigator.clipboard.writeText(input.value).then(() => {
          const btn = event.target;
          const original = btn.textContent;
          btn.textContent = "Copiado!";
          setTimeout(() => btn.textContent = original, 1500);
        });
      } else {
        document.execCommand("copy");
      }
    }
  </script>

</body>
</html>
