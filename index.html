<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Analyzer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

   h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    .tabs {
      display:  flex;
      gap: 8px;
      margin-top: 22px;
      background: #09090b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #29292d;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.ativo {
      background: #29292d;
      color: white;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 15px 42px 15px 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
      font-size: 15px;
    }

    .clear-input {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      display: none;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:disabled { opacity: .5; }

    #resultado { margin-top: 20px; }

    .box {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .label {
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    a {
      color: #ddd;
      word-break: break-all;
    }

    .erro {
      color: #ff9999;
      background: #301416;
      border: 1px solid #702020;
      padding: 15px;
      border-radius: 12px;
    }

    .aviso {
      color: #ffd875;
      background: #30270f;
      border: 1px solid #705b1c;
      padding: 15px;
      border-radius: 12px;
    }

    .sucesso {
      color: #86efac;
      background: #14291c;
      border: 1px solid #1f5c37;
      padding: 15px;
      border-radius: 12px;
    }

    .short-link {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .short-link input {
      font-family: monospace;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
    }

    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #4ade80;
      color: #062b14;
    }

    .open-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #29292d;
      color: white;
    }

    .cancel-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
    }

    .hist-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 4px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hist-titulo {
      color: #999;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .limpar-btn {
      border: 1px solid #702020;
      background: transparent;
      color: #ff9999;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .hist-item {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      position: relative;
    }

    .hist-original {
      color: #ddd;
      font-size: 13px;
      word-break: break-all;
      padding-right: 30px;
      margin-bottom: 6px;
    }

    .hist-curto {
      color: #4ade80;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .hist-data {
      color: #666;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .hist-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hist-acoes .copy-btn,
    .hist-acoes .open-btn,
    .hist-acoes .cancel-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    .fechar-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .fechar-btn:hover {
      background: #29292d;
      color: #ff9999;
    }

    .hist-vazio {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
    }

    .aviso-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .aviso-acoes .manter-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #4ade80;
      color: #062b14;
    }

    .aviso-acoes .cancel-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    .confirmacao {
      background: #1c1c20;
      border: 1px solid #702020;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .confirmacao strong {
      color: #ff9999;
    }

    .confirmacao-acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .confirmacao-acoes .apagar-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #dc2626;
      color: white;
    }

    .confirmacao-acoes .cancel-btn {
      padding: 10px 16px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 34px; }
      form { flex-direction: column; }
      button[type="submit"] { height: 50px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tag">LINK ANALYZER</div>

    <h1 id="titulo">Analisador de links</h1>

    <p id="subtitulo">
      Descubra o destino final de um link e visualize seus redirecionamentos.
    </p>

    <div class="tabs">
      <button class="tab ativo" data-modo="analisar">Analisar</button>
      <button class="tab" data-modo="encurtar">Encurtar</button>
      <button class="tab" data-modo="historico">Histórico</button>
    </div>

    <form id="form">
      <div class="input-wrap">
        <input
          id="url"
          type="url"
          placeholder="https://exemplo.com/link"
          required
        >
        <button type="button" class="clear-input" id="clearInput" title="Limpar">✕</button>
      </div>

      <button id="botao" type="submit">
        Analisar
      </button>
    </form>

    <div id="resultado"></div>

  </div>

  <script>
    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("botao");
    const titulo = document.getElementById("titulo");
    const subtitulo = document.getElementById("subtitulo");
    const tabs = document.querySelectorAll(".tab");
    const clearInput = document.getElementById("clearInput");

    const HIST_KEY = "linkAnalyzerHistorico";
    const LIMITE">
_AVISO = 100;

    let modo = "anal         isar";

    function atualizarXInput() < {
      clearInput.style.display = urlInput.value.length > 0div ? "block class" : "none";
    }

    urlInput.addEventListener("input="", atualizarXInput);

    clearInput.addEventListener("click", function() {
      urlInput.value = "";
      atualizarXInput();
      urlInput.focus();
    });

    atualizarXInput();

    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        modo = tab.dataset.modo;

        tabs.forEach(t => t.classList.remove("ativo"));
        tab.classList.add("ativo");

        resultado.innerHTML = "";

        if (modo === "analisar") {
          form.style.display = "flex";
          titulo.textContent = "Analisador de links";
          subtitulo.textContent = "Descubra o destino final de um link e visualize seus redirecionamentos.";
          botao.textContent = "Analisar";
          urlInput.placeholder = "https://exemplo.com/link";
        } else if (modo === "encurtar") {
          form.style.display = "flex";
          titulo.textContent = "Encurtador de links";
          subtitulo.textContent = "Cole uma URL e receba um link curto que redireciona para o destino final.";
          botao.textContent = "Encurtar";
          urlInput.placeholder = "https://exemplo.com/link-muito-longo";
        } else {
          form.style.display = "none";
          titulo.textContent = "Histórico";
          subtitulo.textContent = "Todos os links que você já encurtou neste navegador.";
          renderizarHistorico();
        }
      });
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const url = urlInput.value.trim();

      resultado.innerHTML = "";
      botao.disabled = true;
      botao.textContent = modo === "analisar" ? "Analisando..." : "Encurtando...";

      try {
        const endpoint = modo === "analisar" ? "/api/analisar" : "/api/encurtar";

        const resposta = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.error || "Erro na requisição.");
        }

        if (modo === "analisar") {
          renderizarAnalise(dados);
        } else {
          salvarNoHistorico(dados);
          renderizarEncurtado(dados);
        }

      } catch (erro) {
        resultado.innerHTML = `
          <div class="erro">${erro.message}</div>
        `;
      } finally {
        botao.disabled = false;
        botao.textContent = modo === "analisar" ? "Analisar" : "Encurtar";
      }
    });

    function renderizarAnalise(dados) {
      let html = `
        <div class="box">
          <div class="label">DESTINO FINAL</div>
          <a href="${dados.finalUrl}" target="_blank">${dados.finalUrl}</a>
        </div>

        <div class="box">
          <div class="label">DOMÍNIO FINAL</div>
          ${dados.finalHost}
        </div>

        <div class="boxlabel">REDIRECIONAMENTOS</div>
          ${dados.redirects.length}
        </div>
      `;

      if (dados.warnings && dados.warnings.length) {
        html += `
          <div class="aviso">
            <strong>Atenção</strong>
            <ul>
              ${dados.warnings.map(w => `<li>${w}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      html += `
        <div class="box">
          <div class="label">CADEIA DE REDIRECIONAMENTOS</div>
      `;

      dados.redirects.forEach((item, index) => {
        html += `
          <p>
            ${index + 1}.
            <strong>${item.status}</strong><br>
            <a href="${item.url}" target="_blank">${item.url}</a>
          </p>
        `;
      });

      html += `</div>`;

      resultado.innerHTML = html;
    }

    function renderizarEncurtado(dados) {
      const avisoReuso = dados.reutilizado
        ? `<div class="aviso" style="margin-bottom:12px;">♻️ Esse link já tinha sido encurtado antes. Reutilizei o mesmo código.</div>`
        : "";

      const html = `
        ${avisoReuso}
        <div class="sucesso">
          <strong>✅ Link curto criado!</strong>
        </div>

        <div class="box">
          <div class="label">LINK CURTO</div>
          <div class="short-link">
            <input type="text" value="${dados.shortUrl}" readonly id="linkCurto">
            <button class="copy-btn" type="button" onclick="copiarLink('linkCurto', this)">Copiar</button>
            <button class="open-btn" type="button" onclick="abrirLink('${dados.shortUrl}')">Abrir</button>
          </div>
        </div>

        <div class="box">
          <div class="label">DESTINO FINAL</div>
          <a href="${dados.finalUrl}" target="_blank">${dados.finalUrl}</a>
        </div>
      `;

      resultado.innerHTML = html;
    }

    function lerHistorico() {
      try {
        const raw = localStorage.getItem(HIST_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function gravarHistorico(lista) {
      localStorage.setItem(HIST_KEY, JSON.stringify(lista));
    }

    function salvarNoHistorico(dados) {
      const lista = lerHistorico();
      const jaExiste = lista.some(item => item.shortUrl === dados.shortUrl);
      if (jaExiste) return;

      lista.unshift({
        shortUrl: dados.shortUrl,
        finalUrl: dados.finalUrl,
        originalUrl: dados.originalUrl,
        criadoEm: new Date().toISOString()
      });

      gravarHistorico(lista);
    }

    function renderizarHistorico() {
      const lista = lerHistorico();

      if (!lista.length) {
        resultado.innerHTML = `
          <div class="hist-vazio">
            Nenhum link salvo ainda.<br>
            Encurte um link pra ele aparecer aqui. 🔗
          </div>
        `;
        return;
      }

      let html = `
        <div class="hist-topo">
          <div class="hist-titulo">${lista.length} link${lista.length > 1 ? "s" : ""} salvo${lista.length > 1 ? "s" : ""}</div>
          <button class="limpar-btn" onclick="pedirConfirmacaoLimparTudo()">Limpar tudo</button>
        </div>
      `;

      if (lista.length >= LIMITE_AVISO) {
        html += `
          <div class="aviso" style="margin-top:12px;">
            <strong>⚠️ Histórico pesado</strong>
            <p style="margin: 6px 0 0; color:#ffd875;">
              Você tem ${lista.length} links salvos. Quantos quer manter?
            </p>
            <div class="aviso-acoes">
              <button class="manter-btn" onclick="manterUltimos(10)">Manter 10</button>
              <button class="manter-btn" onclick="manterUltimos(20)">Manter 20</button>
              <button class="manter-btn" onclick="manterUltimos(50)">Manter 50</button>
              <button class="cancel-btn" onclick="fecharAviso()">Agora não</button>
            </div>
          </div>
        `;
      }

      lista.forEach(function(item, index) {
        html += `
          <div class="hist-item">
            <button class="fechar-btn" onclick="removerItem(${index})">✕</button>
            <div class="hist-original">${item.originalUrl}</div>
            <div class="hist-curto">${item.shortUrl}</div>
            <div class="hist-data">Encurtado em ${formatarData(item.criadoEm)}</div>
            <div class="hist-acoes">
              <button class="copy-btn" onclick="copiarTexto('${item.shortUrl}', this)">Copiar</button>
              <button class="open-btn" onclick="abrirLink('${item.shortUrl}')">Abrir</button>
            </div>
          </div>
        `;
      });

      resultado.innerHTML = html;
    }

    function removerItem(index) {
      const lista = lerHistorico();
      lista.splice(index, 1);
      gravarHistorico(lista);
      renderizarHistorico();
    }

    function pedirConfirmacaoLimparTudo() {
      resultado.innerHTML = `
        <div class="confirmacao">
          <strong>⚠️ Apagar TODOS os links?</strong>
          <p style="margin: 8px 0 0; color:#ccc;">
            Essa ação não pode ser desfeita.
          </p>
          <div class="confirmacao-acoes">
            <button class="apagar-btn" onclick="confirmarLimparTudo()">Sim, apagar tudo</button>
            <button class="cancel-btn" onclick="renderizarHistorico()">Cancelar</button>
          </div>
        </div>
      `;
    }

    function confirmarLimparTudo() {
      localStorage.removeItem(HIST_KEY);
      renderizarHistorico();
    }

    function manterUltimos(n) {
      const lista = lerHistorico();
      const mantidos = lista.slice(0, n);
      gravarHistorico(mantidos);
      renderizarHistorico();
    }

    function fecharAviso() {
      renderizarHistorico();
      const aviso = resultado.querySelector(".aviso");
      if (aviso) aviso.style.display = "none";
    }

    function abrirLink(url) {
      window.open(url, "_blank");
    }

    function copiarLink(id, btn) {
      const input = document.getElementById(id);
      copiarTexto(input.value, btn);
    }

    function copiarTexto(texto, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(texto).then(() => {
          const original = btn.textContent;
          btn.textContent = "Copiado!";
          setTimeout(() => btn.textContent = original, 1500);
        });
      } else {
        const tmp = document.createElement("textarea");
        tmp.value = texto;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);

        const original = btn.textContent;
        btn.textContent = "Copiado!";
        setTimeout(() => btn.textContent = original, 1500);
      }
    }

    function formatarData(iso) {
      const d = new Date(iso);
      const dia = String(d.getDate()).padStart(2, "0");
      const mes = String(d.getMonth() + 1).padStart(2, "0");
      const ano = d.getFullYear();
      const hora = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${dia}/${mes}/${ano} às ${hora}:${min}`;
    }
  </script>

</body>
</html>
