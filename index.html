<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Analyzer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      background: #09090b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #29292d;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.ativo {
      background: #29292d;
      color: white;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 15px 42px 15px 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
      font-size: 15px;
    }

    .clear-input {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      display: none;
    }

    .clear-input:hover {
      background: #29292d;
      color: #fff;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:disabled { opacity: .5; }

    #resultado { margin-top: 20px; }

    .box {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .label {
      color: #888;
      font-size: 12px;
      margin-bottom: 7px;
    }

    a {
      color: #ddd;
      word-break: break-all;
    }

    .erro {
      color: #ff9999;
      background: #301416;
      border: 1px solid #702020;
      padding: 15px;
      border-radius: 12px;
    }

    .aviso {
      color: #ffd875;
      background: #30270f;
      border: 1px solid #705b1c;
      padding: 15px;
      border-radius: 12px;
    }

    .sucesso {
      color: #86efac;
      background: #14291c;
      border: 1px solid #1f5c37;
      padding: 15px;
      border-radius: 12px;
    }

    .short-link {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .short-link input {
      font-family: monospace;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #09090b;
      color: white;
    }

    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #4ade80;
      color: #062b14;
    }

    .open-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: #29292d;
      color: white;
    }

    .cancel-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
    }

    .hist-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 4px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hist-titulo {
      color: #999;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .limpar-btn {
      border: 1px solid #702020;
      background: transparent;
      color: #ff9999;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .hist-item {
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      position: relative;
    }

    .hist-original {
      color: #ddd;
      font-size: 13px;
      word-break: break-all;
      padding-right: 30px;
      margin-bottom: 6px;
    }

    .hist-curto {
      color: #4ade80;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .hist-data {
      color: #666;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .hist-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hist-acoes .copy-btn,
    .hist-acoes .open-btn,
    .hist-acoes .cancel-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    .fechar-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .fechar-btn:hover {
      background: #29292d;
      color: #ff9999;
    }

    .hist-vazio {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
    }

    .aviso-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .aviso-acoes .manter-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #4ade80;
      color: #062b14;
    }

    .aviso-acoes .cancel-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    .confirmacao {
      background: #1c1c20;
      border: 1px solid #702020;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .confirmacao strong {
      color: #ff9999;
    }

    .confirmacao-acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .confirmacao-acoes .apagar-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #dc2626;
      color: white;
    }

    .confirmacao-acoes .cancel-btn {
      padding: 10px 16px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 34px; }
      form { flex-direction: column; }
      button[type="submit"] { height: 50px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="tag">LINK ANALYZER</div>

    <h1 id="titulo">Analisador de links</h1>

    <p id="subtitulo">
      Descubra o destino final de um link e visualize seus redirecionamentos.
    </p>

    <div class="tabs">
      <button class="tab ativo" data-modo="analisar">Analisar</button>
      <button class="tab" data-modo="encurtar">Encurtar</button>
      <button class="tab" data-modo="historico">Histórico</button>
    </div>

    <form id="form">
      <div class="input-wrap">
        <input
          id="url"
          type="url"
          placeholder="https://exemplo.com/link"
          required
        >
        <button type="button" class="clear-input" id="clearInput" title="Limpar">✕</button>
      </div>

      <button id="botao" type="submit">
        Analisar
      </button>
    </form>

    <div id="resultado"></div>

  </div>
