<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Analyzer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #141416;
      border: 1px solid #29292d;
      border-radius: 22px;
      padding: 28px;
    }

    .tag {
      color: #999;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #999;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      background: #09090b;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #29292d;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #999;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.ativo {
      background: #29292d;
      color: white;
    }
